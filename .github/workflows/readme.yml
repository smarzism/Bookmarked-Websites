name: Update README

on:
  push:
    branches: [main, master]
    paths:
      - sites.json
      - scripts/build-readme.mjs
      - README.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme
  cancel-in-progress: false

jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild README from sites.json
        run: node scripts/build-readme.mjs

      # Commits made with GITHUB_TOKEN don't trigger other workflows, so this can't loop.
      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then
            echo "README.md already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update README from sites.json"
          git push
